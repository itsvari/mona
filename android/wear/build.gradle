plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keyFile = file('../key.properties')
def keys = new Properties()
if (keyFile.exists()) keyFile.withInputStream { keys.load(it) }
def monaVersion = (file('../../pubspec.yaml').text =~ /(?m)^version:\s*([^+\s]+)\+(\d+)\s*$/)
if (!monaVersion.find()) throw new GradleException('Mona version must include a build number in pubspec.yaml')
def monaVersionName = monaVersion.group(1)
def monaVersionCode = monaVersion.group(2).toInteger()

android {
    signingConfigs {
        release {
            if (keyFile.exists()) {
                keyAlias keys['keyAlias']
                keyPassword keys['keyPassword']
                if (keys['storeFile']) {
                    def keyPath = new File(keys['storeFile'])
                    storeFile keyPath.isAbsolute() ? keyPath : new File(file('../app'), keys['storeFile'])
                }
                storePassword keys['storePassword']
            }
        }
    }
    namespace 'com.deliacheminot.mona.wear'
    compileSdk 37
    defaultConfig {
        applicationId 'com.deliacheminot.mona'
        minSdk 30
        targetSdk 36
        versionCode 100000000 + monaVersionCode
        versionName monaVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    flavorDimensions 'distribution'
    productFlavors {
        store { dimension 'distribution' }
        standalone { dimension 'distribution' }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            resValue 'string', 'app_name', 'Mona (dev)'
        }
        release {
            signingConfig keyFile.exists() ? signingConfigs.release : signingConfigs.debug
            resValue 'string', 'app_name', 'Mona'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true; resValues true }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.wear.compose:compose-material3:1.7.0-rc01'
    implementation 'androidx.wear.compose:compose-foundation:1.7.0-rc01'
    implementation 'androidx.wear.compose:compose-navigation:1.7.0-rc01'
    implementation 'androidx.wear:wear-input:1.2.0'
    implementation 'androidx.wear:wear:1.4.0'
    implementation 'androidx.wear:wear-phone-interactions:1.1.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.10.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.10.0'
}
